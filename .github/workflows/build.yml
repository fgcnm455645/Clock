
name: Build Vyra Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o VyraClock-GitHub-Project.zip

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("VyraClock/app/build.gradle.kts")
          s = p.read_text()

          marker = "    compileSdk = 35"
          if marker not in s:
              raise SystemExit("Could not find compileSdk in app/build.gradle.kts")

          if "compileOptions {" not in s:
              s = s.replace(marker, marker + """

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }""", 1)

          p.write_text(s)
          print("Java and Kotlin targets configured for JVM 17.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p VyraClock assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VyraClock-debug-apk
          path: VyraClock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
