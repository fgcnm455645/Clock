
name: Build Vyra Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o VyraClock-GitHub-Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -p VyraClock assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VyraClock-debug-apk
          path: VyraClock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

